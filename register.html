<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenPot</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">
    <!-- =========================================
     Register Page
========================================= -->

    <main class="auth-page">

        <!-- Top Controls -->
        <div class="auth-controls">

            <button type="button" class="auth-control" id="themeToggle" aria-label="Toggle dark mode">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button type="button" class="auth-control" id="rtlToggle" aria-label="Toggle RTL">
                <i class="fa-solid fa-right-left"></i>
            </button>

        </div>


        <!-- Register Card -->
        <div class="auth-card register-card">

            <!-- Logo -->
            <a href="index.html" class="auth-logo">

                <img src="images/logo.png" alt="GreenPot">

            </a>


            <!-- Heading -->
            <div class="auth-heading">

                <h1>
                    Create an account
                </h1>

                <p>
                    Join GreenPot and make your spaces a little greener.
                </p>

            </div>


            <!-- Register Form -->
            <form class="auth-form" action="#" method="post">

                <!-- Full Name -->
                <div class="auth-form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <div class="auth-input">

                        <i class="fa-regular fa-user"></i>

                        <input type="text" id="register-name" name="name" placeholder="Your full name" required>

                    </div>

                </div>


                <!-- Email -->
                <div class="auth-form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <div class="auth-input">

                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="register-email" name="email" placeholder="Your email" required>

                    </div>

                </div>


                <!-- Password -->
                <div class="auth-form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="auth-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="register-password" name="password" placeholder="Create a password"
                            required>

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="auth-form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="auth-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="confirm-password" name="confirm_password"
                            placeholder="Confirm your password" required>

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <label class="register-terms">

                    <input type="checkbox" name="terms" required>

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <!-- Create Account -->
                <button type="submit" class="auth-submit">

                    Create Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

            <!-- Divider -->
            <div class="auth-divider">

                <span>
                    or continue with
                </span>

            </div>


            <!-- Social Login -->
            <div class="social-login">

                <!-- Google -->
                <a href="#" class="social-button google-button" aria-label="Continue with Google">

                    <img src="images/google-logo.svg" alt="Google">

                </a>


                <!-- Facebook -->
                <a href="#" class="social-button facebook-button" aria-label="Continue with Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>


                <!-- Apple -->
                <a href="#" class="social-button apple-button" aria-label="Continue with Apple">

                    <i class="fa-brands fa-apple"></i>

                </a>

            </div>


            <!-- Login Link -->
            <div class="auth-register">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign In
                </a>

            </div>

        </div>

    </main>

    <!-- Mobile Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
