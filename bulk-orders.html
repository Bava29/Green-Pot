<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenPot</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bulk-orders-page">

    <!-- =========================================
     Bulk Orders Page
========================================= -->

    <main class="bulk-page">

        <!-- =====================================
         Top Bar
    ====================================== -->

        <div class="bulk-topbar">

            <!-- Logo -->

            <a href="index.html" class="bulk-logo">

                <img src="images/logo.png" alt="GreenPot">

            </a>


            <!-- Controls -->

            <div class="bulk-controls">

                <button type="button" class="bulk-control" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>


                <button type="button" class="bulk-control" id="rtlToggle" aria-label="Toggle RTL">
                    <i class="fa-solid fa-right-left"></i>
                </button>

            </div>

        </div>


        <!-- =====================================
         Intro
    ====================================== -->

        <section class="bulk-intro">

            <span class="bulk-label">
                Bulk Orders
            </span>

            <h1>
                Grow bigger,<br>
                together.
            </h1>

            <p>
                Bring thoughtful greenery to offices, hospitality
                spaces and larger projects with GreenPot's bulk
                plant and garden essentials.
            </p>

        </section>


        <!-- =====================================
         Bulk Order Form
    ====================================== -->

        <section class="bulk-form-section">

            <div class="bulk-form-card">

                <div class="bulk-form-heading">

                    <span>
                        Tell us what you need
                    </span>

                    <p>
                        Share a few details and our team will
                        get back to you with suitable options.
                    </p>

                </div>


                <form class="bulk-form" action="#" method="post">

                    <!-- Name -->

                    <div class="bulk-form-group">

                        <label for="bulk-name">
                            Full Name
                        </label>

                        <input type="text" id="bulk-name" name="name" placeholder="Enter your full name" required>

                    </div>


                    <!-- Email + Phone -->

                    <div class="bulk-form-row">

                        <div class="bulk-form-group">

                            <label for="bulk-email">
                                Email Address
                            </label>

                            <input type="email" id="bulk-email" name="email" placeholder="Enter your email" required>

                        </div>


                        <div class="bulk-form-group">

                            <label for="bulk-phone">
                                Phone Number
                            </label>

                            <input type="tel" id="bulk-phone" name="phone" placeholder="Enter your phone number"
                                required>

                        </div>

                    </div>


                    <!-- Organization -->

                    <div class="bulk-form-group">

                        <label for="bulk-business">
                            Business / Organization
                        </label>

                        <input type="text" id="bulk-business" name="business"
                            placeholder="Enter business or organization name">

                    </div>


                    <!-- Order Type -->

                    <div class="bulk-form-group">

                        <label for="bulk-type">
                            Order Type
                        </label>

                        <select id="bulk-type" name="order_type" required>

                            <option value="">
                                Select order type
                            </option>

                            <option value="office">
                                Office Plants
                            </option>

                            <option value="landscaping">
                                Landscaping
                            </option>

                            <option value="hospitality">
                                Hospitality / Commercial
                            </option>

                            <option value="gifting">
                                Corporate Gifting
                            </option>

                            <option value="plants">
                                Bulk Plants
                            </option>

                            <option value="pots">
                                Pots & Planters
                            </option>

                            <option value="other">
                                Other Requirement
                            </option>

                        </select>

                    </div>


                    <!-- Quantity -->

                    <div class="bulk-form-row">

                        <div class="bulk-form-group">

                            <label for="bulk-quantity">
                                Approximate Quantity
                            </label>

                            <input type="text" id="bulk-quantity" name="quantity" placeholder="Example: 50 plants">

                        </div>


                        <div class="bulk-form-group">

                            <label for="bulk-budget">
                                Estimated Budget
                            </label>

                            <select id="bulk-budget" name="budget">

                                <option value="">
                                    Select budget range
                                </option>

                                <option value="under-25k">
                                    Under ₹25,000
                                </option>

                                <option value="25k-50k">
                                    ₹25,000 – ₹50,000
                                </option>

                                <option value="50k-1l">
                                    ₹50,000 – ₹1 Lakh
                                </option>

                                <option value="above-1l">
                                    Above ₹1 Lakh
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- Requirements -->

                    <div class="bulk-form-group">

                        <label for="bulk-message">
                            Tell Us About Your Requirement
                        </label>

                        <textarea id="bulk-message" name="message" rows="6"
                            placeholder="Tell us about your space, preferred plants, quantity or any other requirements..."
                            required></textarea>

                    </div>


                    <!-- Submit -->

                    <button type="submit" class="bulk-submit">

                        Send Bulk Enquiry

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================================
     Scroll To Top
========================================= -->

    <button type="button" class="scroll-top" id="scrollTop" aria-label="Scroll to top" title="Back to Top">

        <i class="fa-solid fa-arrow-up"></i>

    </button>


    <!-- Mobile Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
