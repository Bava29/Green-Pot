<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GreenPot</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">


    <!-- =========================================
     Login Page
========================================= -->

    <main class="auth-page">

        <!-- Top Controls -->
        <div class="auth-controls">

            <button type="button" class="auth-control" id="themeToggle" aria-label="Toggle dark mode">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button type="button" class="auth-control" id="rtlToggle" aria-label="Toggle RTL">
                <i class="fa-solid fa-right-left"></i>
            </button>

        </div>


        <!-- Login Card -->
        <div class="auth-card">

            <!-- Logo -->
            <a href="index.html" class="auth-logo">
                <img src="images/logo.png" alt="GreenPot">
            </a>


            <!-- Heading -->
            <div class="auth-heading">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Sign in to continue your GreenPot journey.
                </p>

            </div>


            <!-- Login Form -->
            <form class="auth-form" action="#" method="post">

                <!-- Email -->
                <div class="auth-form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <div class="auth-input">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
                    </div>

                </div>


                <!-- Password -->
                <div class="auth-form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="auth-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="login-password" name="password" placeholder="Enter your password"
                            required>

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="auth-options">

                    <label class="remember-me">

                        <input type="checkbox" name="remember">

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="auth-submit">
                    Log In

                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <!-- Divider -->
            <div class="auth-divider">
                <span>or continue with</span>
            </div>


            <!-- Social Login -->
            <div class="social-login">

                <!-- Google -->
                <a href="#" class="social-button google-button" aria-label="Continue with Google">
                    <img src="images/google-logo.svg" alt="Google">
                </a>


                <!-- Facebook -->
                <a href="#" class="social-button facebook-button" aria-label="Continue with Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>


                <!-- Apple -->
                <a href="#" class="social-button apple-button" aria-label="Continue with Apple">
                    <i class="fa-brands fa-apple"></i>
                </a>

            </div>


            <!-- Register -->
            <div class="auth-register">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create an account
                </a>

            </div>

        </div>

    </main>

    <!-- Mobile Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
